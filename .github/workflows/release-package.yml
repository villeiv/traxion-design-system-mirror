name: Node.js Package

on:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Install from the monorepo root so the workspace resolves a single,
      # deduped dependency tree (matching local builds). Installing inside
      # packages/design-system in isolation pulls a second @types/react copy,
      # which breaks the .d.ts build (Radix CSSProperties augmentation mismatch).
      - run: npm install
      - run: npm test --workspace=@traxion-global/design-system

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
      - run: npm install
      - run: npm run build --workspace=@traxion-global/design-system
      - run: npm publish --workspace=@traxion-global/design-system
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
